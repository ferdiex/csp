<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ver el tablero: N reinas</title>
<style>
:root{ --paper:#F6F3EC; --ink:#26231E; --muted:#6E675B; --light:#EDE3CC; --dark:#B9A27A; --queen:#26231E; --bad:#B4432E; --ok:#3E6B3A; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#1C1A17; --ink:#EEE8DC; --muted:#A99F8C; --light:#5C5444; --dark:#3B352B; --queen:#F6F3EC; --bad:#E9826B; --ok:#9CCB8F; color-scheme:dark; } }
:root[data-theme="dark"]{ --paper:#1C1A17; --ink:#EEE8DC; --muted:#A99F8C; --light:#5C5444; --dark:#3B352B; --queen:#F6F3EC; --bad:#E9826B; --ok:#9CCB8F; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,"Times New Roman",serif; line-height:1.5}
main{max-width:46rem; margin:0 auto; padding:2rem 1rem 3rem}
h1{font-weight:400; font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 .3rem}
p{color:var(--muted); margin:0 0 1rem}
code{font-family:"Courier New",monospace}
.ui{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
label.file{display:inline-block; font-weight:600; border:1.5px solid var(--ink); padding:.5rem .9rem; cursor:pointer}
label.file:focus-within{outline:3px solid var(--bad); outline-offset:2px}
input[type=file]{position:absolute; opacity:0; width:1px; height:1px}
#fname{margin-left:.6rem; color:var(--muted)}
#nav{display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin:1rem 0 .3rem}
#nav[hidden]{display:none}
#nav button{font:inherit; font-weight:600; border:1.5px solid var(--ink); background:transparent; color:var(--ink); padding:.35rem .8rem; cursor:pointer}
#nav button:disabled{opacity:.4; cursor:default}
#nav input{font:inherit; width:5.5rem; padding:.3rem .4rem; border:1.5px solid var(--ink); background:transparent; color:var(--ink)}
#nav button:focus-visible,#nav input:focus-visible{outline:3px solid var(--bad); outline-offset:2px}
#summary{margin:.2rem 0 0; font-weight:600}
#summary.ok{color:var(--ok)} #summary.bad{color:var(--bad)}
#info{margin:.8rem 0 1rem}
#info.bad{color:var(--bad)}
.wrap{display:grid; grid-template-columns:1.6rem minmax(0,1fr); grid-template-rows:1.6rem auto; width:min(100%,34rem)}
.cols,.rows{display:grid; color:var(--muted); font-size:.8rem; text-align:center; align-items:center}
.cols{grid-column:2} .rows{grid-row:2}
.board{grid-column:2; grid-row:2; display:grid; aspect-ratio:1; border:2px solid var(--ink)}
.board div{display:flex; align-items:center; justify-content:center; font-size:var(--q); color:var(--queen)}
.board .l{background:var(--light)} .board .d{background:var(--dark)}
.board .x{outline:3px solid var(--bad); outline-offset:-3px}
</style>
</head>
<body>
<main>
  <h1>Ver el tablero</h1>
  <p>Abre un archivo JSON generado con <code>nqueens.pl</code> o <code>nqueens.py</code>: una solución (<code>queens8.json</code>) o la lista de todas (<code>queens8_all.json</code>). La página dibuja las reinas y comprueba que ninguna ataque a otra.</p>
  <div class="ui"><label class="file">Abrir JSON<input type="file" id="f" accept=".json,application/json"></label><span id="fname">Ejemplo: una solución para N = 8</span></div>
  <div id="nav" class="ui" hidden>
    <button type="button" id="prev" aria-label="Solución anterior">◀ Anterior</button>
    <label>Índice <input type="number" id="idx" min="0" value="0" inputmode="numeric"></label>
    <span id="of"></span>
    <button type="button" id="next" aria-label="Solución siguiente">Siguiente ▶</button>
  </div>
  <p id="summary" class="ui" aria-live="polite"></p>
  <div id="info" class="ui" aria-live="polite"></div>
  <div class="wrap"><div class="cols" id="cn"></div><div class="rows" id="rn"></div><div class="board" id="b" role="img" aria-label="Tablero"></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
let N = 0, SOL = [], cur = 0;
const attacks = cols => { const bad = new Set(); for (let i = 0; i < cols.length; i++) for (let j = i + 1; j < cols.length; j++) if (cols[i] === cols[j] || Math.abs(cols[i] - cols[j]) === j - i) { bad.add(i); bad.add(j); } return bad; };
const validShape = (cols, n) => Array.isArray(cols) && cols.length === n && cols.every(c => Number.isInteger(c) && c >= 1 && c <= n);

function load(data) {
  const n = data.n;
  const list = Array.isArray(data.solutions) ? data.solutions : (data.solution ? [data.solution] : null);
  if (!Number.isInteger(n) || n < 1 || !list || !list.length)
    throw new Error('se esperaba {"n": N, "solution": [...]} o {"n": N, "solutions": [[...], ...]}');
  list.forEach((cols, k) => { if (!validShape(cols, n)) throw new Error(`la solución con índice ${k} no tiene ${n} columnas entre 1 y ${n}`); });
  N = n; SOL = list; cur = 0;
  const many = list.length > 1 || Array.isArray(data.solutions);
  $("nav").hidden = !many;
  $("idx").max = list.length - 1;
  $("of").textContent = `de 0 a ${list.length - 1} (${list.length} ${list.length === 1 ? "solución" : "soluciones"})`;
  const invalid = list.filter(c => attacks(c).size).length;
  const distinct = new Set(list.map(c => c.join(","))).size;
  const s = $("summary");
  if (many) {
    s.className = invalid || distinct < list.length ? "bad" : "ok";
    const pl = (k, one, many) => `${k} ${k === 1 ? one : many}`;
    const rep = list.length - distinct;
    s.textContent = `${pl(list.length, "solución", "soluciones")}: ${pl(list.length - invalid, "válida", "válidas")}` + (invalid ? `, ${invalid} con reinas que se atacan` : "") + (rep ? `, ${pl(rep, "repetida", "repetidas")}` : ", ninguna repetida") + ".";
  } else { s.textContent = ""; s.className = ""; }
  show(0);
}

function show(k) {
  cur = Math.max(0, Math.min(SOL.length - 1, k));
  $("idx").value = cur; $("prev").disabled = cur === 0; $("next").disabled = cur === SOL.length - 1;
  const cols = SOL[cur], n = N, bad = attacks(cols);
  const b = $("b"); b.innerHTML = ""; b.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  b.style.setProperty("--q", `min(${Math.floor(28 / n * 1.6 * 10) / 10}rem, 2.2rem)`);
  b.setAttribute("aria-label", `Tablero de ${n} por ${n}, reinas en las columnas ${cols.join(", ")}`);
  $("cn").style.gridTemplateColumns = `repeat(${n}, 1fr)`; $("rn").style.gridTemplateRows = `repeat(${n}, 1fr)`;
  $("cn").innerHTML = Array.from({ length: n }, (_, i) => `<span>${i + 1}</span>`).join("");
  $("rn").innerHTML = Array.from({ length: n }, (_, i) => `<span>${i + 1}</span>`).join("");
  for (let r = 0; r < n; r++) for (let c = 1; c <= n; c++) {
    const d = document.createElement("div");
    d.className = ((r + c) % 2 ? "d" : "l") + (cols[r] === c && bad.has(r) ? " x" : "");
    if (cols[r] === c) d.textContent = "♛";
    b.appendChild(d);
  }
  const head = SOL.length > 1 ? `Índice ${cur}. ` : "";
  $("info").className = bad.size ? "bad" : "";
  $("info").textContent = head + (bad.size ? `N = ${n}: hay reinas que se atacan (marcadas). Columnas por fila: ${cols.join(", ")}.` : `N = ${n}: ninguna reina ataca a otra. Columnas por fila: ${cols.join(", ")}.`);
}

$("f").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  $("fname").textContent = file.name;
  try { load(JSON.parse(await file.text())); }
  catch (err) { $("nav").hidden = true; $("summary").textContent = ""; $("info").className = "bad"; $("info").textContent = "No se pudo leer: " + err.message; $("b").innerHTML = ""; $("cn").innerHTML = ""; $("rn").innerHTML = ""; }
});
$("prev").addEventListener("click", () => show(cur - 1));
$("next").addEventListener("click", () => show(cur + 1));
$("idx").addEventListener("change", () => show(parseInt($("idx").value, 10) || 0));
document.addEventListener("keydown", e => { if ($("nav").hidden || e.target.tagName === "INPUT") return; if (e.key === "ArrowLeft") show(cur - 1); if (e.key === "ArrowRight") show(cur + 1); });
load({ n: 8, solution: [1, 5, 8, 6, 3, 7, 2, 4] });
</script>
</body>
</html>
